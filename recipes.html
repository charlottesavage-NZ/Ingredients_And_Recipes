<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes</title>
    <link rel="stylesheet" href="style.css">
    <!-- Checks this browser is logged in, and sends it to the login
         screen if not - loaded first, before anything else. See auth.js. -->
    <script src="auth.js"></script>
    <!-- The "Took out the ingredients - Undo" message after "I made this" - see undo-toast.js. -->
    <script src="undo-toast.js"></script>
</head>

<body>
    <div class="container">

        <header class="header">
            <h1>Recipes</h1>
            <nav class="main-nav">
                <a href="index.html">Inventory</a>
                <a href="recipes.html" aria-current="page">Recipes</a>
                <!-- Not built yet - placeholder so the link is ready to
                     go the moment price-checker.html exists. -->
                <a href="price-checker.html">Price Checker</a>
            </nav>
        </header>

        <main>
            <!-- ===================== WHO'S VOTING ===================== -->
            <section id="who-section" class="inventory-section">
                <label for="person-select">Who's voting?</label>
                <select id="person-select">
                    <option value="">-- Select your name --</option>
                </select>
            </section>

 
            <!-- ===================== ADD A RECIPE ===================== -->
            <section id="add-recipe-section" class="inventory-section">
                <h2>Add a Recipe</h2>

                <!-- Optional shortcut: upload a .txt file instead of typing
                     everything in by hand. The file needs to follow a
                     Title / Ingredients / Instructions layout - recipes.js
                     reads it and fills in the form below for you to check
                     over. Nothing is saved until you click "Save Recipe". -->
                <div id="recipe-upload-section">
                    <label for="recipe-file-input">Upload a recipe text file:</label>
                    <input type="file" id="recipe-file-input" accept=".txt">
                </div>

                <form id="recipe-form">
                    <input type="text" id="recipe-name" placeholder="Recipe Name" required>
                    <textarea id="recipe-instructions" placeholder="Instructions" rows="4" required></textarea>

                    <!-- This is where ingredient rows get added dynamically
                         by recipes.js. It starts empty and JavaScript fills
                         it in as the "Add Ingredient" button is clicked. -->
                    <div id="ingredient-rows"></div>

                    <!-- Shared datalist for every ingredient name input.
                         recipes.js fills this with known item names, the
                         same way index.html suggests names for pantry items. -->
                    <datalist id="ingredient-names-list"></datalist>

                    <button type="button" id="add-ingredient-btn">+ Add Ingredient</button>
                    <button type="submit">Save Recipe</button>
                </form>
            </section>

            <!-- ===================== FILTER RECIPES ===================== -->
            <!-- All three filters combine together (AND) - e.g. picking
                 "Todd likes" AND typing "mince" only shows recipes that
                 are BOTH liked by Todd AND contain an ingredient matching
                 "mince". recipes.js reads these values every time any of
                 them changes and re-renders the list below. -->
            <section id="filter-section" class="inventory-section">
                <h2>Filter Recipes</h2>

                <label for="vote-filter">Show recipes where:</label>
                <select id="vote-filter">
                    <option value="">All recipes</option>
                    <option value="everyone-likes">Everyone likes</option>
                    <option value="everyone-dislikes">Everyone dislikes</option>
                    <!-- Per-person "X likes" / "X dislikes" options get
                         added here by recipes.js once the household
                         member list loads from the server. -->
                </select>

                <label for="ingredient-filter">Has ingredient:</label>
                <input type="text" id="ingredient-filter" placeholder="e.g. Mince" list="ingredient-names-list">

                <label for="name-filter">Recipe name contains:</label>
                <input type="text" id="name-filter" placeholder="e.g. Spaghetti">

                <button type="button" id="clear-filters-btn">Clear Filters</button>
            </section>

            <!-- ===================== RECIPE LIST ===================== -->
            <section id="recipe-list-section" class="inventory-section">
                <h2>Saved Recipes</h2>
                <div id="recipe-list"></div>
            </section>

        </main>
    </div>

    <!-- ===================== "I MADE THIS" POP-UP ===================== -->
    <!-- Hidden until you click "I made this" on a recipe. A <dialog> is
         the browser's built-in pop-up box - it sits on top of the page
         and greys out everything behind it. recipes.js fills in the
         title and one row per ingredient (each with an editable amount,
         pre-filled from the recipe) every time it opens.
         method="dialog" means submitting the form just closes the box
         instead of reloading the page - recipes.js does the rest. -->
    <dialog id="made-dialog" class="made-dialog">
        <form method="dialog" id="made-form">
            <h3 id="made-title"></h3>
            <p class="made-hint">Change any amount if you used more or less. Set it to 0 to leave that one alone.</p>

            <!-- One row per ingredient that can be taken out of stock -->
            <div id="made-rows"></div>

            <!-- tsp/tbsp amounts etc. that are deliberately NOT removed -->
            <p id="made-left-alone" class="made-left-alone"></p>

            <div class="made-buttons">
                <button type="button" id="made-cancel-btn">Cancel</button>
                <button type="submit" id="made-confirm-btn">Remove from stock</button>
            </div>
        </form>
    </dialog>

    <script src="recipes.js"></script>
</body>
</html>
