<!DOCTYPE html>
<html>
<head>
    <title>Fetch Test</title>
</head>
<body>

    <h1>Fetch Test</h1>

    <!-- We'll display whatever the server sends back, right here -->
    <p id="output">Loading...</p>

    <script>
        // fetch() asks the server at this address for data.
        // It doesn't respond instantly, so we use .then() to say
        // "once you get a response, do this next".
        fetch('http://localhost:3000')

            // The response arrives, but the actual content (JSON)
            // needs to be extracted from it - .json() does that,
            // and it also takes a moment, hence another .then().
            .then(response => response.json())

            // Now "data" is our actual array of pantry items,
            // e.g. [{name: "Flour", ...}, {name: "Sugar", ...}]
            .then(data => {

                // Just prove it worked by showing it on the page.
                document.getElementById('output').textContent =
                    JSON.stringify(data);
            })

            // If anything goes wrong (server not running, etc),
            // show the error instead of failing silently.
            .catch(error => {
                document.getElementById('output').textContent =
                    'Error: ' + error;
            });
    </script>

</body>
</html>
