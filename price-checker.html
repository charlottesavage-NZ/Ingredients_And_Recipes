<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Checker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <header class="header">
            <h1>Price Checker</h1>
            <nav class="main-nav">
                <a href="index.html">Inventory</a>
                <a href="recipes.html">Recipes</a>
                <a href="price-checker.html">Price Checker</a>
            </nav>
        </header>

        <main>
            <!-- ===================== SEARCH WOOLWORTHS ===================== -->
            <section id="price-search-section" class="inventory-section">
                <h2>Check a Price</h2>
                <p>Check a price below - searches your selected store live and shows every matching product. Click "Save" on any result you want to keep in your price history.</p>

                <div id="price-search-form">
                    <input type="text" id="price-search-input" placeholder="e.g. Mince" list="item-names-list">

                    <!-- Filled in by price-checker.js from the
                         server's list of known stores. -->
                    <select id="store-select"></select>

                    <button type="button" id="price-search-btn">Search</button>
                </div>

                <!-- Same known-item-names suggestions as the other
                     pages, filled in by price-checker.js. -->
                <datalist id="item-names-list"></datalist>

                <!-- Filled in with one row per matching product once
                     a search finishes - starts empty. -->
                <div id="price-search-results"></div>
            </section>

            <!-- ===================== SAVED PRICE HISTORY ===================== -->
            <section id="price-history-section" class="inventory-section">
                <h2>Saved Prices</h2>

                <!-- Narrows the saved prices down to products whose name
                     contains what's typed (e.g. "beans"). Each product
                     below has its own date dropdown for older checks. -->
                <input type="text" id="price-history-filter" placeholder="Search saved prices e.g. Beans">

                <div id="price-history-list"></div>
            </section>
        </main>
    </div>

    <script src="price-checker.js"></script>
</body>
</html>
