<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Checker</title>
    <link rel="stylesheet" href="style.css">
    <!-- Checks this browser is logged in, and sends it to the login
         screen if not - loaded first, before anything else. See auth.js. -->
    <script src="auth.js"></script>
</head>

<body>
    <div class="container">

        <header class="header">
            <h1>Price Checker</h1>
            <nav class="main-nav">
                <a href="index.html">Inventory</a>
                <a href="recipes.html">Recipes</a>
                <a href="planner.html">Meal Planner</a>
                <a href="price-checker.html" aria-current="page">Price Checker</a>
            </nav>
        </header>

        <main>
            <!-- ===================== SEARCH WOOLWORTHS ===================== -->
            <section id="price-search-section" class="inventory-section">
                <h2>Check a Price</h2>
                <p>Check a price below - searches your selected store live and shows every matching product. Click "Save" on any result you want to keep in your price history.</p>

                <!-- Each box sits in its own little column with a small
                     label above it, all lined up in one row (they stack
                     on top of each other on a narrow phone screen) -
                     see .price-field in style.css. -->
                <div id="price-search-form">
                    <div class="price-field price-field-grow">
                        <label for="price-search-input">Search for</label>
                        <input type="text" id="price-search-input" placeholder="e.g. Mince" list="item-names-list">
                    </div>

                    <div class="price-field">
                        <label for="store-select">Store</label>
                        <!-- Filled in by price-checker.js from the
                             server's list of known stores. -->
                        <select id="store-select"></select>
                    </div>

                    <!-- Re-orders the search results below. Changing it
                         doesn't search again - price-checker.js just
                         re-sorts what's already there. "Unit price" compares
                         everything per kg / per litre so it's fair. -->
                    <div class="price-field">
                        <label for="price-sort">Sort by</label>
                        <select id="price-sort">
                            <option value="">Best match</option>
                            <option value="name-asc">Name A-Z</option>
                            <option value="name-desc">Name Z-A</option>
                            <option value="price-asc">Price: low to high</option>
                            <option value="price-desc">Price: high to low</option>
                            <option value="unit-asc">Unit price: low to high</option>
                            <option value="unit-desc">Unit price: high to low</option>
                        </select>
                    </div>

                    <button type="button" id="price-search-btn">Search</button>
                </div>

                <!-- Same known-item-names suggestions as the other
                     pages, filled in by price-checker.js. -->
                <datalist id="item-names-list"></datalist>

                <!-- Filled in with one row per matching product once
                     a search finishes - starts empty. -->
                <div id="price-search-results"></div>
            </section>

            <!-- ===================== WATCH LIST ===================== -->
            <!-- Products you've starred (the "Watch" button on a search
                 result). The garage checks their prices by itself every
                 morning and saves them, so the price history and graphs
                 build up without anyone searching. A "Price drop" badge
                 shows when one's cheaper than last time. See WATCH LIST
                 in price-checker.js and server.js. -->
            <section id="watch-list-section" class="inventory-section">
                <h2>Watch List</h2>
                <!-- "Last checked 7:02am today" etc. -->
                <p id="watch-list-status"></p>
                <div id="watch-list"></div>
                <button type="button" id="watch-check-btn">Check prices now</button>
            </section>

            <!-- ===================== SAVED PRICE HISTORY ===================== -->
            <section id="price-history-section" class="inventory-section">
                <h2>Saved Prices</h2>

                <!-- Narrows the saved prices down to products whose name
                     contains what's typed (e.g. "beans"). Each product
                     below has its own date dropdown for older checks. -->
                <input type="text" id="price-history-filter" placeholder="Search saved prices e.g. Beans">

                <div id="price-history-list"></div>
            </section>
        </main>
    </div>

    <script src="price-checker.js"></script>
</body>
</html>
